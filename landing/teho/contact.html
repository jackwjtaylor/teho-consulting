<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Teho Consulting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="container nav__inner">
        <a class="brand" href="index.html">Teho Consulting</a>
        <a class="btn btn--ghost" href="index.html">Back</a>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container" style="max-width:700px;">
          <h1>Let’s talk about your next AI win</h1>
          <p class="section__lead">Drop Jack a note or book time directly.</p>
          <div class="card" style="gap:0.8rem;">
            <p><strong>Email:</strong> <a class="btn btn--ghost" href="mailto:jack@teho.ai">jack@teho.ai</a></p>
            <p><strong>Calendly:</strong> <a class="btn btn--ghost" href="https://calendly.com/teho-jack/ai-briefing" target="_blank">Schedule a call</a></p>
            <p><strong>Location:</strong> Remote-first, UK time zone.</p>
          </div>
          <form class="card" style="margin-top:1.5rem;" method="post" action="#">
            <label>Name
              <input type="text" name="name" required />
            </label>
            <label>Email
              <input type="email" name="email" required />
            </label>
            <label>Message
              <textarea name="message" placeholder="Tell us about your company or opportunity."></textarea>
            </label>
            <button class="btn btn--primary" type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
