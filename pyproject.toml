[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teho-automation"
version = "0.1.0"
description = "Automation scripts for Teho Consulting lead-generation workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Teho Consulting"}]
license = {text = "MIT"}
dependencies = [
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "tenacity>=8.3.0",
    "openai>=1.51.0",
    "supabase>=2.4.0",
    "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0"
]
pdf = [
    "weasyprint>=62.0"
]
ui = [
    "streamlit>=1.35.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.2.0"
]

[project.scripts]
teho = "teho_automation.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
